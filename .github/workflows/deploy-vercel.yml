name: Deploy to Vercel

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          echo "Running: npx vercel deploy --prod --yes --token [redacted]"
          npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"

# Notes:
# - Add a repository secret named `VERCEL_TOKEN` with a Vercel Personal Token.
# - Set `VERCEL_ORG_ID` and `VERCEL_PROJECT_ID` as repository variables or secrets
#   to make the deployment target explicit in CI.